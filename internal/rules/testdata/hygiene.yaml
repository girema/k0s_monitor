# Good practices (H01–H06). In shop:
# - api: no memory limit and no requests, no probes though a Service sends
#   it traffic, an image without a tag, a budget that allows no disruption
#   with its single replica.
# - web: everything right: limits, probes, a pinned image, 2 replicas and a
#   budget that allows one to be stopped.
# - agent: a privileged DaemonSet container with a :latest init image.
# - finished pods: an evicted pod of 10 days ago is listed; a job's pod and
#   a pod that finished yesterday are not.
# In kube-system, k0s's own coredns has no probes and is left out.
