  conditions:
  - {type: Ready, status: "True", reason: KubeletReady, lastTransitionTime: "2026-09-01T00:00:00Z"}
  - {type: DiskPressure, status: "True", reason: KubeletHasDiskPressure, message: "kubelet has disk pressure", lastTransitionTime: "2026-09-27T13:31:00Z"}
  - {type: MemoryPressure, status: "False", lastTransitionTime: "2026-09-01T00:00:00Z"}
---
apiVersion: v1
