# V05: k0s stopped. The nodes world (worker-3 stopped reporting, and the
# checkout app runs only there), with node-exporter's systemd collector:
# k0sworker failed on worker-3, so the node's problem folds under it.
# The controller ctrl-1, which is no node, restarts k0scontroller over and
# over; a host k0s-monitor doesn't know has k0sworker stopped.
