# Certificates of apps (X09), in TLS Secrets. The clock is 2026-09-27 14:00.
# - web-tls (shop.example.com) expires in 5 days; Ingress web also serves
#   www.example.com, which the certificate doesn't cover.
# - api-tls expired 2 days ago; the api pods mount it.
# - le-tls, renewed by cert-manager, expires in 20 days: renewal isn't late.
# - late-tls, renewed by cert-manager, expires in 10 days: renewal failed.
# - old-tls expires in 3 days but nothing uses it.
# - wild-tls (*.example.com) is valid for months.
# - a generic Secret is not read at all.
apiVersion: v1
kind: Node
metadata: {name: worker-1}
status:
  conditions:
  - {type: Ready, status: "True", reason: KubeletReady, lastTransitionTime: "2026-09-01T00:00:00Z", lastHeartbeatTime: "2026-09-27T13:59:50Z"}
  allocatable: {cpu: "4", memory: 8Gi, pods: "110"}
---
apiVersion: v1
kind: Secret
metadata: {name: web-tls, namespace: shop}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: c2VjcmV0LWtleS1uZXZlci1rZXB0
---
apiVersion: v1
kind: Secret
metadata: {name: api-tls, namespace: shop}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: c2VjcmV0LWtleS1uZXZlci1rZXB0
---
apiVersion: v1
kind: Secret
metadata: {name: le-tls, namespace: shop, annotations: {cert-manager.io/certificate-name: le}}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: c2VjcmV0LWtleS1uZXZlci1rZXB0
---
apiVersion: v1
kind: Secret
metadata: {name: late-tls, namespace: shop, annotations: {cert-manager.io/certificate-name: late, kubectl.kubernetes.io/last-applied-configuration: "{\"data\":{\"tls.key\":\"c2VjcmV0LWtleS1uZXZlci1rZXB0\"}}"}}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: c2VjcmV0LWtleS1uZXZlci1rZXB0
---
apiVersion: v1
kind: Secret
metadata: {name: old-tls, namespace: shop}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: c2VjcmV0LWtleS1uZXZlci1rZXB0
---
apiVersion: v1
kind: Secret
metadata: {name: wild-tls, namespace: shop}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: c2VjcmV0LWtleS1uZXZlci1rZXB0
---
apiVersion: v1
kind: Secret
metadata: {name: db-password, namespace: shop}
type: Opaque
data: {password: aHVudGVyMjI=}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: shop}
spec:
  tls:
  - {hosts: [shop.example.com, www.example.com], secretName: web-tls}
  - {hosts: [le.example.com], secretName: le-tls}
  - {hosts: [late.example.com], secretName: late-tls}
  - {hosts: [app.example.com], secretName: wild-tls}
  - {hosts: [default.example.com]}
  rules:
  - host: shop.example.com
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: web-a1b2c
  namespace: shop
  labels: {kubernetes.io/service-name: web}
addressType: IPv4
endpoints:
- addresses: ["10.244.1.11"]
  conditions: {ready: true}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop, annotations: {deployment.kubernetes.io/revision: "1"}}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec: {containers: [{name: api, image: "registry.local/shop/api:1.0"}]}
status: {replicas: 1, readyReplicas: 1, availableReplicas: 1}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: api-6d5c4b3a2
  namespace: shop
  annotations: {deployment.kubernetes.io/revision: "1"}
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: api, uid: d-api, controller: true}]
spec:
  replicas: 1
  selector: {matchLabels: {app: api, pod-template-hash: 6d5c4b3a2}}
  template:
    metadata: {labels: {app: api, pod-template-hash: 6d5c4b3a2}}
    spec: {containers: [{name: api, image: "registry.local/shop/api:1.0"}]}
---
apiVersion: v1
kind: Pod
metadata:
  name: api-6d5c4b3a2-z9y8x
  namespace: shop
  labels: {app: api, pod-template-hash: 6d5c4b3a2}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: api-6d5c4b3a2, uid: rs-api, controller: true}]
spec:
  nodeName: worker-1
  volumes: [{name: tls, secret: {secretName: api-tls}}, {name: db, secret: {secretName: db-password}}]
  containers:
  - name: api
    image: "registry.local/shop/api:1.0"
    volumeMounts: [{name: tls, mountPath: /etc/tls, readOnly: true}]
status:
  phase: Running
  conditions: [{type: Ready, status: "True"}]
  containerStatuses:
  - {name: api, image: "registry.local/shop/api:1.0", imageID: "", ready: true, restartCount: 0, state: {running: {startedAt: "2026-09-20T00:00:00Z"}}}
