# accounts/login's autoscaler (named session-cache) scales on CPU utilization, but
# the session-cache container of its pods has no CPU request, so it can't
# compute it (hpa.no-metrics, the missing-request case). The metrics API
# works. login is deployed by Helm. The clock is 2026-09-27 14:00.
apiVersion: v1
kind: Node
metadata: {name: worker-1}
status:
  conditions: [{type: Ready, status: "True", lastTransitionTime: "2026-09-01T00:00:00Z"}]
  allocatable: {cpu: "8", memory: 32Gi, pods: "110"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: accounts
  labels: {app.kubernetes.io/managed-by: Helm}
  annotations: {meta.helm.sh/release-name: login, deployment.kubernetes.io/revision: "3"}
spec:
  replicas: 2
  selector: {matchLabels: {app: login}}
  template:
    metadata: {labels: {app: login}}
    spec:
      containers:
      - {name: login, image: "registry.local/accounts/login:2.3", resources: {requests: {cpu: 250m, memory: 256Mi}}}
      - {name: session-cache, image: "registry.local/accounts/session-cache:1.2"}
status: {replicas: 2, readyReplicas: 2, availableReplicas: 2}
