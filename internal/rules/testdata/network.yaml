# ingress.backend-missing: shop/storefront routes /api to a Service that does
# not exist and /img to a port name the Service doesn't have.
# lb.pending: shop/public-lb has waited an hour for an external address;
# shop/new-lb was created 5 min ago and is not reported yet.
apiVersion: v1
kind: Node
metadata: {name: worker-1}
status:
  conditions: [{type: Ready, status: "True", lastTransitionTime: "2026-09-01T00:00:00Z"}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: storefront, namespace: shop, creationTimestamp: "2026-09-01T00:00:00Z"}
spec:
  rules:
  - host: shop.example.com
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: storefront, port: {number: 80}}}}
      - {path: /api, pathType: Prefix, backend: {service: {name: api-gw, port: {number: 8080}}}}
      - {path: /img, pathType: Prefix, backend: {service: {name: images, port: {name: http}}}}
---
apiVersion: v1
kind: Pod
metadata: {name: storefront-1, namespace: shop, labels: {app: storefront}}
spec:
  nodeName: worker-1
  containers: [{name: web, image: "registry.local/storefront:1"}]
status:
  phase: Running
  conditions: [{type: Ready, status: "True", lastTransitionTime: "2026-09-20T00:00:00Z"}]
  containerStatuses:
  - {name: web, ready: true, state: {running: {startedAt: "2026-09-20T00:00:00Z"}}}
---
apiVersion: v1
kind: Pod
metadata: {name: images-1, namespace: shop, labels: {app: images}}
spec:
  nodeName: worker-1
  containers: [{name: img, image: "registry.local/images:1"}]
status:
  phase: Running
  conditions: [{type: Ready, status: "True", lastTransitionTime: "2026-09-20T00:00:00Z"}]
  containerStatuses:
  - {name: img, ready: true, state: {running: {startedAt: "2026-09-20T00:00:00Z"}}}
---
apiVersion: v1
kind: Service
metadata: {name: storefront, namespace: shop, creationTimestamp: "2026-09-01T00:00:00Z"}
spec:
  type: ClusterIP
  selector: {app: storefront}
  ports: [{port: 80, protocol: TCP}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: storefront-abc
  namespace: shop
  labels: {kubernetes.io/service-name: storefront}
addressType: IPv4
endpoints: [{addresses: ["10.244.0.5"], conditions: {ready: true}}]
---
apiVersion: v1
kind: Service
metadata: {name: images, namespace: shop, creationTimestamp: "2026-09-01T00:00:00Z"}
spec:
  type: ClusterIP
  selector: {app: images}
  ports: [{port: 80, protocol: TCP}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: images-abc
  namespace: shop
  labels: {kubernetes.io/service-name: images}
addressType: IPv4
endpoints: [{addresses: ["10.244.0.5"], conditions: {ready: true}}]
---
apiVersion: v1
kind: Service
metadata: {name: public-lb, namespace: shop, creationTimestamp: "2026-09-27T13:00:00Z"}
spec:
  type: LoadBalancer
  selector: {app: storefront}
  ports: [{port: 443, protocol: TCP, nodePort: 31443}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: public-lb-abc
  namespace: shop
  labels: {kubernetes.io/service-name: public-lb}
addressType: IPv4
endpoints: [{addresses: ["10.244.0.5"], conditions: {ready: true}}]
---
apiVersion: v1
kind: Service
metadata: {name: new-lb, namespace: shop, creationTimestamp: "2026-09-27T13:55:00Z"}
spec:
  type: LoadBalancer
  selector: {app: storefront}
  ports: [{port: 443, protocol: TCP, nodePort: 31444}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: new-lb-abc
  namespace: shop
  labels: {kubernetes.io/service-name: new-lb}
addressType: IPv4
endpoints: [{addresses: ["10.244.0.5"], conditions: {ready: true}}]
