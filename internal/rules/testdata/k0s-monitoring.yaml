# A monitoring chart (victoria-metrics-k8s-stack, Helm release vmstack)
# made Services in kube-system for kube-controller-manager, kube-scheduler
# and etcd pods, which k0s doesn't have: on k0s that is H07, a suggestion,
# not a broken Service (X02). Its CoreDNS Service matches. shop/web's
# selector has a real typo (X02 with a closest match), and shop/old
# selects an app that isn't installed: no closest match, since no pod
# misses by a single label. The clock is 2026-09-27 14:00.
apiVersion: v1
kind: Node
metadata: {name: worker-1}
status:
  conditions: [{type: Ready, status: "True", lastTransitionTime: "2026-09-01T00:00:00Z"}]
  allocatable: {cpu: "8", memory: 32Gi, pods: "110"}
  nodeInfo: {kubeletVersion: v1.36.4+k0s}
---
apiVersion: v1
kind: Pod
metadata:
  name: calico-kube-controllers-5b8f7c6d9-abcde
  namespace: kube-system
  labels: {k8s-app: calico-kube-controllers}
spec: {nodeName: worker-1, containers: [{name: calico-kube-controllers, image: "quay.io/calico/kube-controllers:v3.30"}]}
status: {phase: Running, conditions: [{type: Ready, status: "True"}]}
---
apiVersion: v1
kind: Pod
metadata:
  name: coredns-6d9f8b7c5-fghij
  namespace: kube-system
  labels: {k8s-app: kube-dns}
spec: {nodeName: worker-1, containers: [{name: coredns, image: "quay.io/k0sproject/coredns:1.12"}]}
status: {phase: Running, conditions: [{type: Ready, status: "True"}]}
---
apiVersion: v1
kind: Service
metadata:
  name: vmstack-victoria-metrics-k8s-stack-kube-controller-manager
  namespace: kube-system
  creationTimestamp: "2026-09-01T00:00:00Z"
  labels: {app.kubernetes.io/managed-by: Helm, app.kubernetes.io/instance: vmstack}
  annotations: {meta.helm.sh/release-name: vmstack, meta.helm.sh/release-namespace: monitoring}
spec: {clusterIP: None, selector: {component: kube-controller-manager}, ports: [{name: http-metrics, port: 10257}]}
---
apiVersion: v1
kind: Service
metadata:
  name: vmstack-victoria-metrics-k8s-stack-kube-scheduler
  namespace: kube-system
  creationTimestamp: "2026-09-01T00:00:00Z"
  annotations: {meta.helm.sh/release-name: vmstack}
spec: {clusterIP: None, selector: {component: kube-scheduler}, ports: [{name: http-metrics, port: 10259}]}
---
apiVersion: v1
kind: Service
metadata:
  name: vmstack-victoria-metrics-k8s-stack-kube-etcd
  namespace: kube-system
  creationTimestamp: "2026-09-01T00:00:00Z"
  annotations: {meta.helm.sh/release-name: vmstack}
spec: {clusterIP: None, selector: {component: etcd}, ports: [{name: http-metrics, port: 2379}]}
---
apiVersion: v1
kind: Service
metadata:
  name: vmstack-victoria-metrics-k8s-stack-core-dns
  namespace: kube-system
  creationTimestamp: "2026-09-01T00:00:00Z"
  annotations: {meta.helm.sh/release-name: vmstack}
spec: {clusterIP: None, selector: {k8s-app: kube-dns}, ports: [{name: http-metrics, port: 9153}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: web, tier: front}}
  template: {metadata: {labels: {app: web, tier: front}}, spec: {containers: [{name: web, image: "shop/web:1.0"}]}}
status: {replicas: 1, readyReplicas: 1}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-7c9f8d6b5-x2kqp
  namespace: shop
  labels: {app: web, tier: front}
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: web, uid: d-web, controller: true}]
spec: {nodeName: worker-1, containers: [{name: web, image: "shop/web:1.0"}]}
status: {phase: Running, conditions: [{type: Ready, status: "True"}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop, creationTimestamp: "2026-09-01T00:00:00Z"}
spec: {selector: {app: web-frontend, tier: front}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: old, namespace: shop, creationTimestamp: "2026-09-01T00:00:00Z"}
spec: {selector: {component: legacy-api}, ports: [{port: 80}]}
