# Pods that wait for sick nodes. worker-1 is low on disk and is the only
# node with disk=ssd, which web needs. worker-2 stopped reporting and
# worker-4 never did; the agent DaemonSet's pods for them cannot be placed.
# worker-3 is healthy but too small for big, which therefore waits for CPU,
# not for a node to recover. cp-1 is reserved for the control plane and
# changes nothing.
