  conditions: [{type: Ready, status: "True"}]
  containerStatuses:
  - {name: web, image: "registry.local/shop/web:2.3.1", imageID: "", ready: true, restartCount: 0, state: {running: {startedAt: "2026-09-20T00:00:00Z"}}}
