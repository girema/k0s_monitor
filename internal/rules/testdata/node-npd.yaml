spec:
  nodeName: worker-1
  containers:
  - name: web
    image: "registry.local/shop/web:2.3.1"
    resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {memory: 128Mi}}
    readinessProbe: {httpGet: {path: /ready, port: 8080}}
