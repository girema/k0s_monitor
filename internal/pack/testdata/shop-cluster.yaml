# The Shop product on a cluster, for the example pack (internal/pack/example.yaml):
# payments-api runs 1 of 2 replicas, crash-loops and runs 2.2.0 instead of
# 2.3.*; the database volume is 82% full (the pack allows 70%); the backup
# CronJob is missing; the checkout query returns 3.5 errors/s.
apiVersion: v1
kind: Node
metadata: {name: worker-1}
status:
  conditions: [{type: Ready, status: "True", lastTransitionTime: "2026-09-01T00:00:00Z", lastHeartbeatTime: "2026-09-27T13:59:50Z"}]
  allocatable: {cpu: "4", memory: 8Gi, pods: "110"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments-api, namespace: shop, creationTimestamp: "2026-09-20T00:00:00Z", annotations: {deployment.kubernetes.io/revision: "4"}}
spec:
  replicas: 2
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata: {labels: {app: payments-api}}
    spec: {containers: [{name: api, image: "registry.shop.example/payments-api:2.2.0"}]}
status:
  replicas: 2
  updatedReplicas: 2
  readyReplicas: 1
  availableReplicas: 1
  conditions:
  - {type: Available, status: "True", lastTransitionTime: "2026-09-27T13:00:00Z", lastUpdateTime: "2026-09-27T13:00:00Z"}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: payments-api-6d4b9
  namespace: shop
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: payments-api, uid: d1, controller: true}]
spec:
  replicas: 2
  selector: {matchLabels: {app: payments-api, pod-template-hash: 6d4b9}}
  template:
    metadata: {labels: {app: payments-api, pod-template-hash: 6d4b9}}
    spec: {containers: [{name: api, image: "registry.shop.example/payments-api:2.2.0"}]}
---
apiVersion: v1
kind: Pod
metadata:
  name: payments-api-6d4b9-aaaaa
  namespace: shop
  labels: {app: payments-api, pod-template-hash: 6d4b9}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: payments-api-6d4b9, uid: rs1, controller: true}]
spec:
  nodeName: worker-1
  containers: [{name: api, image: "registry.shop.example/payments-api:2.2.0"}]
status:
  phase: Running
  conditions: [{type: Ready, status: "False"}]
  containerStatuses:
  - name: api
    image: registry.shop.example/payments-api:2.2.0
    imageID: ""
    ready: false
    restartCount: 12
    state: {waiting: {reason: CrashLoopBackOff, message: "back-off 5m0s restarting failed container=api"}}
    lastState: {terminated: {exitCode: 1, reason: Error, startedAt: "2026-09-27T13:59:52Z", finishedAt: "2026-09-27T13:59:55Z"}}
---
apiVersion: v1
kind: Pod
metadata:
  name: payments-api-6d4b9-bbbbb
  namespace: shop
  labels: {app: payments-api, pod-template-hash: 6d4b9}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: payments-api-6d4b9, uid: rs1, controller: true}]
spec:
  nodeName: worker-1
  containers: [{name: api, image: "registry.shop.example/payments-api:2.2.0"}]
status:
  phase: Running
  conditions: [{type: Ready, status: "True"}]
  containerStatuses:
  - {name: api, image: "registry.shop.example/payments-api:2.2.0", imageID: "", ready: true, restartCount: 0, state: {running: {startedAt: "2026-09-27T10:00:00Z"}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: shop, creationTimestamp: "2026-09-20T00:00:00Z"}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront}}
    spec: {containers: [{name: web, image: "registry.shop.example/storefront:2.3.1"}]}
status: {replicas: 1, updatedReplicas: 1, readyReplicas: 1, availableReplicas: 1}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec: {containers: [{name: postgres, image: "registry.shop.example/postgres:2.3.0"}]}
status: {replicas: 1, readyReplicas: 1}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data-postgres-0, namespace: shop, creationTimestamp: "2026-09-01T00:00:00Z"}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
status: {phase: Bound, capacity: {storage: 10Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres-0
  namespace: shop
  labels: {app: postgres}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: postgres, uid: ss1, controller: true}]
spec:
  nodeName: worker-1
  containers: [{name: postgres, image: "registry.shop.example/postgres:2.3.0"}]
  volumes: [{name: data, persistentVolumeClaim: {claimName: data-postgres-0}}]
status:
  phase: Running
  conditions: [{type: Ready, status: "True"}]
  containerStatuses:
  - {name: postgres, image: "registry.shop.example/postgres:2.3.0", imageID: "", ready: true, restartCount: 0, state: {running: {startedAt: "2026-09-27T10:00:00Z"}}}
---
apiVersion: k0s-monitor.io/v1
kind: Metrics
have: [kubelet-volumes]
volumes:
  shop/data-postgres-0: {used: 8.2Gi, capacity: 10Gi}
queries:
  'sum by (namespace) (rate(http_requests_total{namespace="shop", code=~"5.."}[5m]))':
  - {labels: {namespace: shop}, value: 3.5}
