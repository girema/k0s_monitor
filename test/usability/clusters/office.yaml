---
apiVersion: apps/v1
kind: Deployment
metadata: {name: intranet, namespace: office, annotations: {deployment.kubernetes.io/revision: "7"}}
spec:
  replicas: 2
  selector: {matchLabels: {app: intranet}}
  template:
    metadata: {labels: {app: intranet}}
    spec:
      containers:
      - name: intranet
        image: "office/intranet:4.2.1"
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
status: {replicas: 2, updatedReplicas: 2, readyReplicas: 2, availableReplicas: 2}
