# Usability test, cluster office: everything works. The intranet runs 2 of
# 2 copies, and its Service has both ready.
apiVersion: v1
kind: Node
metadata: {name: office-1, labels: {kubernetes.io/hostname: office-1}}
status:
  conditions:
  - {type: Ready, status: "True", reason: KubeletReady, lastTransitionTime: "2026-09-01T00:00:00Z", lastHeartbeatTime: "2026-09-27T13:59:50Z"}
